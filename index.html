<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر الطلبات — إدارة طلبات متجرك</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10b981">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="إدارة طلبات تيك توك وواتساب للبائع العراقي">
<style>
  :root{
    --bg:#080c14; --card:#111827; --card2:#1a2332; --line:#232d42;
    --txt:#e8edf7; --muted:#7f8ba3; --green:#10b981; --cyan:#25f4ee;
    --pink:#fe2c55; --amber:#f59e0b; --red:#ef4444; --blue:#3b82f6;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ overscroll-behavior-y:contain; }
  body{
    font-family:"Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
    background:radial-gradient(1200px 500px at 50% -20%, #12203a 0%, var(--bg) 60%);
    color:var(--txt); min-height:100vh; padding-bottom:40px; font-size:14px; line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  
  /* ===== Auth Screen ===== */
  #authScreen{ position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; }
  .auth-box{ width:100%; max-width:400px; background:var(--card); padding:30px; border-radius:var(--radius); border:1px solid var(--line); box-shadow:0 20px 40px rgba(0,0,0,0.4); }
  .auth-logo{font-size:40px; text-align:center; margin-bottom:10px;}
  .auth-title{text-align:center; font-size:20px; font-weight:800; margin-bottom:5px;}
  .auth-sub{text-align:center; color:var(--muted); font-size:13px; margin-bottom:20px;}
  .auth-input{ width:100%; padding:12px; margin-bottom:12px; border-radius:10px; background:var(--bg); border:1px solid var(--line); color:var(--txt); font-family:inherit; font-size:14px; outline:none; }
  .auth-input:focus{border-color:var(--green);}
  .auth-btn{ width:100%; padding:12px; border-radius:10px; border:none; background:linear-gradient(135deg,var(--green),#059669); color:#fff; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:10px; font-family:inherit; }
  .auth-btn.secondary{background:transparent; border:1px solid var(--line); color:var(--txt);}
  .auth-error{color:var(--red); font-size:13px; text-align:center; margin-bottom:10px; display:none; background:rgba(239,68,68,.1); padding:10px; border-radius:8px; border:1px solid rgba(239,68,68,.3);}
  
  /* ===== Header ===== */
  header{ position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 22px; background:rgba(8,12,20,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--card2); padding-top:calc(14px + env(safe-area-inset-top)); }
  .logo{ width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:22px; background:linear-gradient(135deg,var(--green),var(--cyan)); box-shadow:0 0 22px rgba(16,185,129,.35); }
  .brand h1{font-size:17px;} .brand p{font-size:12px; color:var(--muted);}
  .actions{margin-inline-start:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .btn{ padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--txt); font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; transition:.2s; }
  .btn:hover{background:#22304d;}
  .btn.primary{background:linear-gradient(135deg,var(--green),#059669); border:none; color:#fff; box-shadow:0 6px 18px rgba(16,185,129,.25);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;}
  .btn.danger{background:rgba(239,68,68,.1); color:#f87171; border-color:rgba(239,68,68,.3);}
  .btn.tiny{padding:7px 12px; font-size:12px;}
  .btn.close{width:100%; margin-top:14px;}
  
  /* ===== KPIs & Layout ===== */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; padding:20px 22px; }
  .kpi{ background:linear-gradient(160deg,var(--card),#16202f); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; display:flex; gap:12px; align-items:center; position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; inset-inline-start:0; top:0; height:100%; width:3px; background:linear-gradient(180deg,var(--green),var(--cyan)); }
  .kpi .icon{font-size:26px;}
  .klabel{font-size:12px; color:var(--muted); margin-bottom:2px;}
  .kval{font-size:22px; font-weight:800;}
  .kval.cyan{color:var(--cyan);} .kval.blue{color:#60a5fa;} .kval.amber{color:#fbbf24;} .kval.green{color:#34d399;} .kval.sm{font-size:16px;}
  .layout{display:grid; grid-template-columns:1fr 320px; gap:18px; padding:0 22px;}
  @media(max-width:950px){ .layout{grid-template-columns:1fr;} }
  
  /* ===== Toolbar & Orders ===== */
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .tab{ padding:8px 14px; border-radius:10px; background:var(--card); border:1px solid var(--line); color:#a8b4cc; font-size:12.5px; font-weight:600; cursor:pointer; transition:.2s; font-family:inherit; }
  .tab:hover{border-color:#2e3a54;}
  .tab.active{background:linear-gradient(135deg,var(--green),#059669); color:#fff; border-color:transparent;}
  .tab .cnt{ display:inline-block; padding:1px 7px; border-radius:99px; background:rgba(255,255,255,.15); margin-inline-start:6px; font-size:11px; }
  .tab.active .cnt{background:rgba(255,255,255,.25);}
  .search{ padding:10px 14px; border-radius:10px; background:var(--card); border:1px solid var(--line); color:var(--txt); font-family:inherit; font-size:13px; min-width:240px; outline:none; transition:.2s; }
  .search:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(16,185,129,.15);}
  .orders{display:flex; flex-direction:column; gap:10px;}
  .order{ display:grid; grid-template-columns:90px 1.2fr 1.6fr auto auto; gap:14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer; transition:.2s; }
  .order:hover{border-color:rgba(16,185,129,.4); transform:translateY(-1px);}
  .order .cust .name{font-weight:700; font-size:14px;} .order .cust .meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .order .prod{font-size:13px;} .order .prod .meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .order .total{font-weight:800; color:#34d399; font-size:14px;} .order .time{font-size:11.5px; color:var(--muted); text-align:left;}
  @media(max-width:700px){ .order{ grid-template-columns:1fr auto; grid-template-areas:"badge total" "cust cust" "prod prod" "time time"; } .order > .badge{grid-area:badge; justify-self:start;} .order > .cust{grid-area:cust;} .order > .prod{grid-area:prod;} .order > .total{grid-area:total;} .order > .time{grid-area:time; text-align:right;} }
  .badge{ padding:5px 11px; border-radius:99px; font-size:11px; font-weight:700; text-align:center; display:inline-block; }
  .badge.new{background:rgba(59,130,246,.15); color:#60a5fa; border:1px solid rgba(59,130,246,.3);}
  .badge.confirmed{background:rgba(6,182,212,.15); color:#22d3ee; border:1px solid rgba(6,182,212,.3);}
  .badge.shipped{background:rgba(245,158,11,.15); color:#fbbf24; border:1px solid rgba(245,158,11,.3);}
  .badge.delivered{background:rgba(16,185,129,.15); color:#34d399; border:1px solid rgba(16,185,129,.3);}
  .badge.cancelled{background:rgba(239,68,68,.15); color:#f87171; border:1px solid rgba(239,68,68,.3);}
  .badge.returned{background:rgba(148,163,184,.15); color:#94a3b8; border:1px solid rgba(148,163,184,.3);}
  .empty{ text-align:center; padding:60px 20px; color:var(--muted); background:var(--card); border-radius:var(--radius); border:1px dashed var(--line); }
  
  /* ===== Side Panel ===== */
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
  .panel h3{font-size:13.5px; margin-bottom:12px; color:#c8d2e6;}
  .hint{font-size:12px; color:var(--muted); margin-bottom:10px; line-height:1.6;}
  .city-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:12.5px; border-bottom:1px solid var(--card2); }
  .city-row:last-child{border-bottom:none;} .city-row .city-count{color:#34d399; font-weight:700;}
  .panel .btn{width:100%; margin-top:8px;}
  
  /* ===== Modals & Toast ===== */
  .modal{ position:fixed; inset:0; background:rgba(3,6,12,.8); backdrop-filter:blur(6px); display:none; place-items:center; padding:20px; z-index:150; }
  .modal.open{display:grid;}
  .modal-box{ width:min(600px,100%); max-height:90vh; overflow:auto; background:linear-gradient(165deg,#131b2b,#0e1524); border:1px solid var(--line); border-radius:18px; padding:24px; }
  .modal-box h2{font-size:18px; margin-bottom:4px;} .modal-box .sub{font-size:12.5px; color:var(--muted); margin-bottom:18px;}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:18px;} .detail-head .meta{font-size:12px; color:var(--muted); margin-top:4px;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .detail-item{ background:rgba(255,255,255,.025); border-radius:10px; padding:10px 12px; border:1px solid var(--card2); }
  .detail-item.wide{grid-column:1/-1;} .detail-item .k{font-size:11px; color:var(--muted); margin-bottom:3px;} .detail-item .v{font-size:13.5px; font-weight:600;}
  .detail-item .v a{color:var(--cyan); text-decoration:none;} .detail-item .v.total{color:#34d399; font-size:15px; font-weight:800;}
  .notes{ background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25); border-radius:10px; padding:10px 12px; font-size:12.5px; color:#fbbf24; margin-bottom:14px; }
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;} .detail-actions .btn{flex:1; min-width:110px; text-align:center; text-decoration:none; display:inline-flex; justify-content:center; align-items:center;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-grid label{display:flex; flex-direction:column; gap:5px; font-size:12px; color:#a8b4cc;}
  .form-grid label.wide{grid-column:1/-1;}
  .form-grid input, .form-grid select, .form-grid textarea{ padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:#0e1524; color:var(--txt); font-family:inherit; font-size:13px; outline:none; transition:.2s; }
  .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus{ border-color:var(--green); box-shadow:0 0 0 3px rgba(16,185,129,.15); }
  .form-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;} .form-actions .btn{min-width:120px;}
  #waText{ width:100%; padding:12px; border-radius:10px; background:#0e1524; color:var(--txt); border:1px solid var(--line); font-family:inherit; font-size:13px; resize:vertical; outline:none; }
  #waText:focus{border-color:var(--green);}
  #toast{ position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translate(-50%,120%); background:linear-gradient(135deg,var(--green),#059669); color:#fff; padding:12px 22px; border-radius:12px; font-weight:700; font-size:13.5px; transition:transform .35s cubic-bezier(.2,1.2,.4,1); z-index:200; box-shadow:0 10px 30px rgba(16,185,129,.35); max-width:90vw; }
  #toast.show{transform:translate(-50%,0);}
  #loading{ display:none; position:fixed; inset:0; background:rgba(3,6,12,.7); z-index:300; place-items:center; color:var(--cyan); font-weight:700; font-size:16px; }
  #loading.show{display:grid;}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">📒</div>
    <div class="auth-title">دفتر الطلبات</div>
    <div class="auth-sub">سجل دخولك لإدارة طلبات متجرك</div>
    
    <form id="authForm" onsubmit="event.preventDefault();">
      <div class="auth-error" id="authError"></div>
      <input type="email" id="authEmail" class="auth-input" placeholder="البريد الإلكتروني" autocomplete="email" required>
      <input type="password" id="authPassword" class="auth-input" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password" required minlength="6">
      <button type="button" class="auth-btn" id="loginBtn">تسجيل الدخول</button>
      <button type="button" class="auth-btn secondary" id="signupBtn">إنشاء حساب جديد</button>
    </form>
  </div>
</div>

<div id="loading">جاري التحميل...</div>

<div id="appScreen" style="display:none;">
  <header>
    <div class="logo">📒</div>
    <div class="brand"><h1>دفتر الطلبات</h1><p>متصل بالسحابة ☁️</p></div>
    <div class="actions">
      <button class="btn ghost" id="installBtn" style="display:none">📲 تثبيت</button>
      <button class="btn ghost" id="pasteWA">📱 لصق رسالة</button>
      <button class="btn primary" id="addOrder">＋ طلب</button>
      <button class="btn danger tiny" id="logoutBtn" style="margin-left:5px;">🚪 خروج</button>
    </div>
  </header>
  <main>
    <section class="kpis" id="kpis"></section>
    <div class="layout">
      <section class="main-col">
        <div class="toolbar">
          <div class="tabs" id="tabs"></div>
          <input class="search" id="search" placeholder="🔍 ابحث بالاسم أو المنتج أو الهاتف">
        </div>
        <div class="orders" id="orders"></div>
      </section>
      <aside class="side-col">
        <div class="panel"><h3>🏙️ أفضل المدن</h3><div id="cities"></div></div>
        <div class="panel"><h3>💡 معلومات</h3><p class="hint">البيانات تُحفظ في السحابة. يمكنك تسجيل الدخول من أي هاتف لرؤية طلباتك.</p><button class="btn tiny ghost" id="exportCSV">⬇ تصدير CSV</button></div>
      </aside>
    </div>
  </main>
</div>

<div class="modal" id="detailModal"><div class="modal-box" id="detailBox"></div></div>
<div class="modal" id="addModal"><div class="modal-box" id="addBox"></div></div>
<div class="modal" id="waModal"><div class="modal-box" id="waBox"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
try {
  const SUPABASE_URL = 'https://opapfupwygwdayftqegd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Hgb1x4d8y7MlmLeELFHtTQ_pHD7NL78';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const STATUS = { 
    new: { label:'جديد' }, confirmed: { label:'مؤكد' }, 
    shipped: { label:'قيد التوصيل' }, delivered: { label:'تم التسليم' }, 
    cancelled: { label:'ملغي' }, returned: { label:'مرتجع' } 
  };
  const CITIES = ['بغداد','البصرة','الموصل','أربيل','النجف','كربلاء','السليمانية','الناصرية','الحلة','كركوك','الديوانية','السماوة','العمارة','دهوك','زاخو'];
  const SOURCE_LABEL = { tiktok:'تيك توك', whatsapp:'واتساب', manual:'يدوي' };

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtIQD = n => (Number(n)||0).toLocaleString('en-US') + ' د.ع';
  const total = o => (o.qty||0) * (o.price||0) + (o.delivery||0);
  const nowMs = () => Date.now();

  function relTime(ts){ const diff = nowMs() - ts; const m = Math.floor(diff / 60000); if(m < 1) return 'الآن'; if(m < 60) return `منذ ${m} د`; const h = Math.floor(m/60); if(h < 24) return `منذ ${h} س`; return `منذ ${Math.floor(h/24)} يوم`; }
  function showToast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2400); }
  function showLoading(show){ $('#loading').classList.toggle('show', show); }

  let orders = []; let currentUser = null; const state = { status:'all', query:'' };

  function getAuthData() {
    return { email: $('#authEmail').value.trim(), password: $('#authPassword').value };
  }

  async function checkUser(){
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if(session) {
        currentUser = session.user; 
        $('#authScreen').style.display = 'none'; 
        $('#appScreen').style.display = 'block'; 
        await loadOrders();
      } else {
        currentUser = null; 
        $('#authScreen').style.display = 'flex'; 
        $('#appScreen').style.display = 'none';
      }
    } catch(e) { showToast('حدث خطأ في الاتصال بالخادم'); }
  }

  $('#loginBtn').onclick = async () => {
    const { email, password } = getAuthData();
    const errEl = $('#authError');
    
    if(!email || !password) { errEl.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور'; errEl.style.display='block'; return; }
    errEl.style.display = 'none'; showLoading(true);
    
    try {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      showLoading(false);
      if(error) { errEl.textContent = 'خطأ: ' + (error.message === 'Invalid login credentials' ? 'البريد أو كلمة المرور غير صحيحة' : error.message); errEl.style.display='block'; }
      else { checkUser(); }
    } catch (e) { showLoading(false); errEl.textContent = 'حدث خطأ في الاتصال.'; errEl.style.display='block'; }
  };

  $('#signupBtn').onclick = async () => {
    const { email, password } = getAuthData();
    const errEl = $('#authError');
    
    if(!email || !password) { errEl.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور'; errEl.style.display='block'; return; }
    if(password.length < 6) { errEl.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل'; errEl.style.display='block'; return; }
    errEl.style.display = 'none'; showLoading(true);
    
    try {
      const { data, error } = await supabase.auth.signUp({ email, password });
      showLoading(false);
      if(error) { errEl.textContent = 'خطأ: ' + error.message; errEl.style.display='block'; }
      else { showToast('تم إنشاء الحساب بنجاح!'); checkUser(); }
    } catch (e) { showLoading(false); errEl.textContent = 'حدث خطأ في الاتصال.'; errEl.style.display='block'; }
  };

  $('#logoutBtn').onclick = async () => { await supabase.auth.signOut(); checkUser(); };

  async function loadOrders(){
    showLoading(true);
    const { data, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
    showLoading(false);
    if(error) { showToast('خطأ في جلب البيانات: ' + error.message); return; }
    orders = data.map(o => ({ id: o.id, order_code: o.order_code || 'ORD-???', name: o.customer_name, phone: o.customer_phone, city: o.customer_city, address: o.customer_address, product: o.product_name, qty: o.quantity, price: o.unit_price, delivery: o.delivery_fee, status: o.status, source: o.source, notes: o.notes, createdAt: new Date(o.created_at).getTime() }));
    render();
  }

  async function saveOrder(orderData){
    showLoading(true);
    const newOrder = { user_id: currentUser.id, order_code: 'ORD-' + Math.floor(Math.random()*10000), customer_name: orderData.name, customer_phone: orderData.phone, customer_city: orderData.city, customer_address: orderData.address, product_name: orderData.product, quantity: orderData.qty, unit_price: orderData.price, delivery_fee: orderData.delivery, status: 'new', source: orderData.source, notes: orderData.notes };
    const { error } = await supabase.from('orders').insert([newOrder]);
    showLoading(false);
    if(error) { showToast('خطأ في الحفظ: ' + error.message); return false; }
    return true;
  }

  async function updateStatus(id, newStatus){
    showLoading(true);
    const { error } = await supabase.from('orders').update({ status: newStatus }).eq('id', id);
    showLoading(false);
    if(error) { showToast('خطأ في التحديث: ' + error.message); return false; }
    return true;
  }

  function renderKPIs(){
    const today = new Date().toDateString(); const todayCount = orders.filter(o => new Date(o.createdAt).toDateString() === today).length; const newCount = orders.filter(o => o.status === 'new').length; const shippedCount = orders.filter(o => o.status === 'shipped').length; const expected = orders.filter(o => ['confirmed','shipped','delivered'].includes(o.status)).reduce((s,o) => s + total(o), 0);
    const cards = [ {icon:'📦', label:'طلبات اليوم', value: todayCount, cls:'cyan'}, {icon:'⏳', label:'بانتظار التأكيد', value: newCount, cls:'blue'}, {icon:'🚚', label:'قيد التوصيل', value: shippedCount, cls:'amber'}, {icon:'💰', label:'التحصيل المتوقع', value: fmtIQD(expected), cls:'green sm'} ];
    $('#kpis').innerHTML = cards.map(c => `<div class="kpi"><div class="icon">${c.icon}</div><div><div class="klabel">${c.label}</div><div class="kval ${c.cls}">${c.value}</div></div></div>`).join('');
  }

  function renderTabs(){
    const counts = { all: orders.length }; Object.keys(STATUS).forEach(k => counts[k] = orders.filter(o => o.status === k).length);
    const tabs = [['all','الكل']].concat(Object.entries(STATUS).map(([k,v]) => [k,v.label]));
    $('#tabs').innerHTML = tabs.map(([k,l]) => `<button class="tab ${state.status===k?'active':''}" data-tab="${k}">${l} <span class="cnt">${counts[k]||0}</span></button>`).join('');
  }

  function filtered(){ let list = orders.slice(); if(state.status !== 'all') list = list.filter(o => o.status === state.status); if(state.query.trim()){ const q = state.query.trim().toLowerCase(); list = list.filter(o => o.name.toLowerCase().includes(q) || o.product.toLowerCase().includes(q) || o.phone.includes(q) || o.order_code.toLowerCase().includes(q)); } return list.sort((a,b) => b.createdAt - a.createdAt); }

  function renderOrders(){
    const list = filtered();
    if(!list.length){ $('#orders').innerHTML = `<div class="empty">لا توجد طلبات مطابقة<br><small>أضف طلبًا جديدًا للبدء</small></div>`; return; }
    $('#orders').innerHTML = list.map(o => { const st = STATUS[o.status]; return `<div class="order" data-open="${o.id}"><span class="badge ${o.status}">${st.label}</span><div class="cust"><div class="name">${esc(o.name)}</div><div class="meta">${esc(o.city)} · ${esc(o.phone)} · ${SOURCE_LABEL[o.source]||''}</div></div><div class="prod"><div>${esc(o.product)}</div><div class="meta">× ${o.qty} · توصيل ${fmtIQD(o.delivery)}</div></div><div class="total">${fmtIQD(total(o))}</div><div class="time">${relTime(o.createdAt)}</div></div>`; }).join('');
  }

  function renderCities(){ const map = {}; orders.forEach(o => map[o.city] = (map[o.city]||0) + 1); const top = Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0,6); $('#cities').innerHTML = top.length ? top.map(([c,n]) => `<div class="city-row"><span>${esc(c)}</span><span class="city-count">${n} طلب</span></div>`).join('') : '<div class="hint">لا توجد بيانات بعد.</div>'; }

  function render(){ renderKPIs(); renderTabs(); renderOrders(); renderCities(); }

  function openOrder(id){
    const o = orders.find(x => x.id === id); if(!o) return;
    const transitions = { new: [['confirmed','✅ تأكيد الطلب','primary'], ['cancelled','❌ إلغاء','danger']], confirmed: [['shipped','🚚 شحن','primary'], ['cancelled','❌ إلغاء','danger']], shipped: [['delivered','📦 تم التسليم','primary'], ['returned','↩ مرتجع','danger']], delivered: [], cancelled: [['new','🔄 إعادة فتح','ghost']], returned: [['new','🔄 إعادة فتح','ghost']] };
    const st = STATUS[o.status]; const btns = (transitions[o.status] || []).map(([s,l,c]) => `<button class="btn ${c}" data-trans="${s}">${l}</button>`).join(''); const waLink = `https://wa.me/964${o.phone.replace(/^0/,'')}`;
    $('#detailBox').innerHTML = `<div class="detail-head"><div><h2>${o.order_code}</h2><div class="meta">${relTime(o.createdAt)} · المصدر: ${SOURCE_LABEL[o.source]}</div></div><span class="badge ${o.status}">${st.label}</span></div><div class="detail-grid"><div class="detail-item"><div class="k">👤 الاسم</div><div class="v">${esc(o.name)}</div></div><div class="detail-item"><div class="k">📞 الهاتف</div><div class="v"><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div></div><div class="detail-item"><div class="k">🏙️ المدينة</div><div class="v">${esc(o.city)}</div></div><div class="detail-item"><div class="k">📍 العنوان</div><div class="v">${esc(o.address||'—')}</div></div><div class="detail-item wide"><div class="k">📦 المنتج</div><div class="v">${esc(o.product)}</div></div><div class="detail-item"><div class="k">الكمية</div><div class="v">× ${o.qty}</div></div><div class="detail-item"><div class="k">سعر الوحدة</div><div class="v">${fmtIQD(o.price)}</div></div><div class="detail-item"><div class="k">التوصيل</div><div class="v">${fmtIQD(o.delivery)}</div></div><div class="detail-item"><div class="k">الإجمالي</div><div class="v total">${fmtIQD(total(o))}</div></div></div>${o.notes ? `<div class="notes">📝 ${esc(o.notes)}</div>` : ''}<div class="detail-actions"><a class="btn ghost" href="${waLink}" target="_blank" rel="noopener">💬 واتساب</a>${btns}</div><button class="btn close" onclick="document.getElementById('detailModal').classList.remove('open')">إغلاق</button>`;
    $('#detailBox').querySelectorAll('[data-trans]').forEach(b => { b.onclick = async () => { showLoading(true); const ok = await updateStatus(o.id, b.dataset.trans); showLoading(false); if(ok){ o.status = b.dataset.trans; render(); openOrder(id); showToast(`تم التحديث إلى: ${STATUS[o.status].label}`); } }; });
    $('#detailModal').classList.add('open');
  }

  function openAddOrder(prefill = {}){
    const p = Object.assign({ name:'', phone:'', city:'', address:'', product:'', qty:1, price:0, delivery:5000, source:'manual', notes:'' }, prefill);
    $('#addBox').innerHTML = `<h2>➕ طلب جديد</h2><div class="sub">سيتم حفظ الطلب في السحابة باسم حسابك.</div><form id="addForm"><div class="form-grid"><label>الاسم <input name="name" required value="${esc(p.name)}"></label><label>الهاتف <input name="phone" required value="${esc(p.phone)}" placeholder="07XXXXXXXXX"></label><label>المدينة<select name="city" required><option value="">اختر…</option>${CITIES.map(c => `<option ${p.city===c?'selected':''}>${c}</option>`).join('')}</select></label><label>العنوان التفصيلي <input name="address" value="${esc(p.address)}"></label><label class="wide">المنتج <input name="product" required value="${esc(p.product)}"></label><label>الكمية <input name="qty" type="number" min="1" value="${p.qty}"></label><label>سعر الوحدة (د.ع) <input name="price" type="number" min="0" value="${p.price||''}"></label><label>سعر التوصيل (د.ع) <input name="delivery" type="number" min="0" value="${p.delivery}"></label><label>المصدر<select name="source"><option value="tiktok" ${p.source==='tiktok'?'selected':''}>تيك توك</option><option value="whatsapp" ${p.source==='whatsapp'?'selected':''}>واتساب</option><option value="manual" ${p.source==='manual'?'selected':''}>يدوي</option></select></label><label class="wide">ملاحظات <textarea name="notes" rows="2">${esc(p.notes)}</textarea></label></div><div class="form-actions"><button type="button" class="btn ghost" onclick="document.getElementById('addModal').classList.remove('open')">إلغاء</button><button type="submit" class="btn primary">💾 حفظ الطلب</button></div></form>`;
    $('#addForm').onsubmit = async (e) => { e.preventDefault(); const fd = new FormData(e.target); const orderData = { name: String(fd.get('name')).trim(), phone: String(fd.get('phone')).trim(), city: String(fd.get('city')), address: String(fd.get('address')).trim(), product: String(fd.get('product')).trim(), qty: parseInt(fd.get('qty')) || 1, price: parseFloat(fd.get('price')) || 0, delivery: parseFloat(fd.get('delivery')) || 0, source: String(fd.get('source')), notes: String(fd.get('notes')).trim() }; const ok = await saveOrder(orderData); if(ok){ $('#addModal').classList.remove('open'); showToast('✅ تم حفظ الطلب سحابيًا'); await loadOrders(); } };
    $('#addModal').classList.add('open');
  }

  function parseWA(text){
    const res = { name:'', phone:'', city:'', address:'', product:'', qty:1, price:0, delivery:5000, source:'whatsapp', notes:'' };
    const phoneM = text.match(/07\d{2}[\s-]?\d{3}[\s-]?\d{4}/); if(phoneM) res.phone = phoneM[0].replace(/[\s-]/g,'');
    const nameM = text.match(/(?:الاسم|اسمي|الاسم الكامل)\s*[:：]?\s*(.+)/i); if(nameM) res.name = nameM[1].trim().split('\n')[0];
    const addrM = text.match(/(?:العنوان|السكن|المنطقة|أقطن)\s*[:：]?\s*(.+)/i); if(addrM) res.address = addrM[1].trim().split('\n')[0];
    for(const c of CITIES){ if(text.includes(c)){ res.city = c; break; } }
    const qtyM = text.match(/(?:الكمية|العدد|كمية)\s*[:：]?\s*(\d+)/i); if(qtyM) res.qty = parseInt(qtyM[1]) || 1;
    const prodM = text.match(/(?:أطلب|اطلب|أريد|اريد|منتج)\s*[:：]?\s*(.+)/i); if(prodM) res.product = prodM[1].trim().split('\n')[0];
    if(!res.name && !res.phone && !res.product){ res.notes = text.slice(0, 200); }
    return res;
  }

  function openWA(){
    $('#waBox').innerHTML = `<h2>📱 استيراد طلب من واتساب</h2><div class="sub">الصق رسالة العميل وسنستخرج البيانات تلقائيًا.</div><textarea id="waText" rows="7" placeholder="الصق رسالة واتساب هنا…"></textarea><button class="btn tiny ghost" id="waSample" style="margin-top:8px">📋 تجربة رسالة</button><div class="form-actions" style="margin-top:16px"><button class="btn ghost" onclick="document.getElementById('waModal').classList.remove('open')">إلغاء</button><button class="btn primary" id="waParse">🔍 تحليل</button></div>`;
    $('#waSample').onclick = () => { $('#waText').value = `السلام عليكم\nأريد أطلب سيروم فيتامين C\nالاسم: أحمد علي حسن\nرقم: 07701234567\nالعنوان: بغداد، الكرادة، شارع 62\nالكمية: 2`; };
    $('#waParse').onclick = () => { const text = $('#waText').value.trim(); if(!text) return showToast('الصق النص أولاً'); $('#waModal').classList.remove('open'); openAddOrder(parseWA(text)); showToast('تم التحليل — راجع البيانات'); };
    $('#waModal').classList.add('open');
  }

  function exportCSV(){
    const headers = ['رقم الطلب','الاسم','الهاتف','المدينة','العنوان','المنتج','الكمية','سعر الوحدة','التوصيل','الإجمالي','الحالة','المصدر','التاريخ'];
    const rows = orders.map(o => [ o.order_code, o.name, o.phone, o.city, o.address, o.product, o.qty, o.price, o.delivery, total(o), STATUS[o.status].label, SOURCE_LABEL[o.source], new Date(o.createdAt).toLocaleString('ar-IQ') ]);
    const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `orders-${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(url); showToast('📥 تم تصدير CSV');
  }

  $('#addOrder').onclick = () => openAddOrder(); $('#pasteWA').onclick = () => openWA(); $('#exportCSV').onclick = () => exportCSV();
  $('#tabs').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if(!t) return; state.status = t.dataset.tab; renderTabs(); renderOrders(); });
  $('#search').addEventListener('input', e => { state.query = e.target.value; renderOrders(); });
  $('#orders').addEventListener('click', e => { const row = e.target.closest('[data-open]'); if(row) openOrder(parseInt(row.dataset.open)); });
  document.querySelectorAll('.modal').forEach(m => { m.addEventListener('click', e => { if(e.target === m) m.classList.remove('open'); }); });

  if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
  let deferredPrompt = null; const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; if (installBtn) installBtn.style.display = 'inline-flex'; });
  if (installBtn) { installBtn.addEventListener('click', async () => { if (!deferredPrompt) { showToast('لتثبيت التطبيق: اختر "إضافة إلى الشاشة الرئيسية" من قائمة المتصفح.'); return; } deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; installBtn.style.display = 'none'; }); }
  window.addEventListener('appinstalled', () => { if (installBtn) installBtn.style.display = 'none'; });

  checkUser();

} catch (globalError) {
  console.error("خطأ فادح:", globalError);
  document.body.innerHTML = `<div style="text-align:center; padding:50px; color:#ef4444;"><h2>عذراً، حدث خطأ فني.</h2><p>يرجى تحديث الصفحة أو المحاولة لاحقاً.</p></div>`;
}
</script>
</body>
</html>
