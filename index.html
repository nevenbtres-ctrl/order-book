<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر الطلبات — إدارة طلبات متجرك</title>

<!-- ===== إضافات PWA ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10b981">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر الطلبات">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="إدارة طلبات تيك توك وواتساب للبائع العراقي">

<style>
  :root{
    --bg:#080c14; --card:#111827; --card2:#1a2332; --line:#232d42;
    --txt:#e8edf7; --muted:#7f8ba3;
    --green:#10b981; --cyan:#25f4ee; --pink:#fe2c55;
    --amber:#f59e0b; --red:#ef4444; --blue:#3b82f6;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ overscroll-behavior-y:contain; }
  body{
    font-family:"Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
    background:radial-gradient(1200px 500px at 50% -20%, #12203a 0%, var(--bg) 60%);
    color:var(--txt); min-height:100vh; padding-bottom:40px; font-size:14px; line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:14px 22px; background:rgba(8,12,20,.9); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--card2);
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .logo{
    width:42px; height:42px; border-radius:12px;
    display:grid; place-items:center; font-size:22px;
    background:linear-gradient(135deg,var(--green),var(--cyan));
    box-shadow:0 0 22px rgba(16,185,129,.35);
  }
  .brand h1{font-size:17px;}
  .brand p{font-size:12px; color:var(--muted);}
  .actions{margin-inline-start:auto; display:flex; gap:8px; flex-wrap:wrap;}
  .btn{
    padding:10px 16px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--txt); font-family:inherit; font-weight:700;
    font-size:13px; cursor:pointer; transition:.2s;
  }
  .btn:hover{background:#22304d;}
  .btn.primary{background:linear-gradient(135deg,var(--green),#059669); border:none; color:#fff; box-shadow:0 6px 18px rgba(16,185,129,.25);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;}
  .btn.danger{background:rgba(239,68,68,.1); color:#f87171; border-color:rgba(239,68,68,.3);}
  .btn.tiny{padding:7px 12px; font-size:12px;}
  .btn.close{width:100%; margin-top:14px;}
  /* ===== KPIs ===== */
  .kpis{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px; padding:20px 22px;
  }
  .kpi{
    background:linear-gradient(160deg,var(--card),#16202f);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; display:flex; gap:12px; align-items:center;
    position:relative; overflow:hidden;
  }
  .kpi::before{
    content:""; position:absolute; inset-inline-start:0; top:0;
    height:100%; width:3px; background:linear-gradient(180deg,var(--green),var(--cyan));
  }
  .kpi .icon{font-size:26px;}
  .klabel{font-size:12px; color:var(--muted); margin-bottom:2px;}
  .kval{font-size:22px; font-weight:800;}
  .kval.cyan{color:var(--cyan);} .kval.blue{color:#60a5fa;}
  .kval.amber{color:#fbbf24;} .kval.green{color:#34d399;}
  .kval.sm{font-size:16px;}
  /* ===== Layout ===== */
  .layout{display:grid; grid-template-columns:1fr 320px; gap:18px; padding:0 22px;}
  @media(max-width:950px){ .layout{grid-template-columns:1fr;} }
  /* ===== Toolbar ===== */
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .tab{
    padding:8px 14px; border-radius:10px; background:var(--card);
    border:1px solid var(--line); color:#a8b4cc;
    font-size:12.5px; font-weight:600; cursor:pointer;
    transition:.2s; font-family:inherit;
  }
  .tab:hover{border-color:#2e3a54;}
  .tab.active{background:linear-gradient(135deg,var(--green),#059669); color:#fff; border-color:transparent;}
  .tab .cnt{
    display:inline-block; padding:1px 7px; border-radius:99px;
    background:rgba(255,255,255,.15); margin-inline-start:6px; font-size:11px;
  }
  .tab.active .cnt{background:rgba(255,255,255,.25);}
  .search{
    padding:10px 14px; border-radius:10px; background:var(--card);
    border:1px solid var(--line); color:var(--txt); font-family:inherit;
    font-size:13px; min-width:240px; outline:none; transition:.2s;
  }
  .search:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(16,185,129,.15);}
  /* ===== Orders ===== */
  .orders{display:flex; flex-direction:column; gap:10px;}
  .order{
    display:grid; grid-template-columns:90px 1.2fr 1.6fr auto auto;
    gap:14px; align-items:center;
    background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px;
    cursor:pointer; transition:.2s;
  }
  .order:hover{border-color:rgba(16,185,129,.4); transform:translateY(-1px);}
  .order .cust .name{font-weight:700; font-size:14px;}
  .order .cust .meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .order .prod{font-size:13px;}
  .order .prod .meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .order .total{font-weight:800; color:#34d399; font-size:14px;}
  .order .time{font-size:11.5px; color:var(--muted); text-align:left;}
  @media(max-width:700px){
    .order{
      grid-template-columns:1fr auto;
      grid-template-areas:"badge total" "cust cust" "prod prod" "time time";
    }
    .order > .badge{grid-area:badge; justify-self:start;}
    .order > .cust{grid-area:cust;}
    .order > .prod{grid-area:prod;}
    .order > .total{grid-area:total;}
    .order > .time{grid-area:time; text-align:right;}
  }
  .badge{
    padding:5px 11px; border-radius:99px; font-size:11px; font-weight:700;
    text-align:center; display:inline-block;
  }
  .badge.new{background:rgba(59,130,246,.15); color:#60a5fa; border:1px solid rgba(59,130,246,.3);}
  .badge.confirmed{background:rgba(6,182,212,.15); color:#22d3ee; border:1px solid rgba(6,182,212,.3);}
  .badge.shipped{background:rgba(245,158,11,.15); color:#fbbf24; border:1px solid rgba(245,158,11,.3);}
  .badge.delivered{background:rgba(16,185,129,.15); color:#34d399; border:1px solid rgba(16,185,129,.3);}
  .badge.cancelled{background:rgba(239,68,68,.15); color:#f87171; border:1px solid rgba(239,68,68,.3);}
  .badge.returned{background:rgba(148,163,184,.15); color:#94a3b8; border:1px solid rgba(148,163,184,.3);}
  .empty{
    text-align:center; padding:60px 20px; color:var(--muted);
    background:var(--card); border-radius:var(--radius); border:1px dashed var(--line);
  }
  /* ===== Side ===== */
  .panel{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px; margin-bottom:14px;
  }
  .panel h3{font-size:13.5px; margin-bottom:12px; color:#c8d2e6;}
  .hint{font-size:12px; color:var(--muted); margin-bottom:10px; line-height:1.6;}
  .city-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:7px 0; font-size:12.5px; border-bottom:1px solid var(--card2);
  }
  .city-row:last-child{border-bottom:none;}
  .city-row .city-count{color:#34d399; font-weight:700;}
  .panel .btn{width:100%; margin-top:8px;}
  /* ===== Modal ===== */
  .modal{
    position:fixed; inset:0; background:rgba(3,6,12,.8); backdrop-filter:blur(6px);
    display:none; place-items:center; padding:20px; z-index:150;
  }
  .modal.open{display:grid;}
  .modal-box{
    width:min(600px,100%); max-height:90vh; overflow:auto;
    background:linear-gradient(165deg,#131b2b,#0e1524);
    border:1px solid var(--line); border-radius:18px; padding:24px;
  }
  .modal-box h2{font-size:18px; margin-bottom:4px;}
  .modal-box .sub{font-size:12.5px; color:var(--muted); margin-bottom:18px;}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:18px;}
  .detail-head .meta{font-size:12px; color:var(--muted); margin-top:4px;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .detail-item{
    background:rgba(255,255,255,.025); border-radius:10px;
    padding:10px 12px; border:1px solid var(--card2);
  }
  .detail-item.wide{grid-column:1/-1;}
  .detail-item .k{font-size:11px; color:var(--muted); margin-bottom:3px;}
  .detail-item .v{font-size:13.5px; font-weight:600;}
  .detail-item .v a{color:var(--cyan); text-decoration:none;}
  .detail-item .v.total{color:#34d399; font-size:15px; font-weight:800;}
  .notes{
    background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25);
    border-radius:10px; padding:10px 12px; font-size:12.5px; color:#fbbf24;
    margin-bottom:14px;
  }
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .detail-actions .btn{flex:1; min-width:110px; text-align:center; text-decoration:none; display:inline-flex; justify-content:center; align-items:center;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-grid label{display:flex; flex-direction:column; gap:5px; font-size:12px; color:#a8b4cc;}
  .form-grid label.wide{grid-column:1/-1;}
  .form-grid input, .form-grid select, .form-grid textarea{
    padding:10px 12px; border-radius:9px; border:1px solid var(--line);
    background:#0e1524; color:var(--txt); font-family:inherit; font-size:13px;
    outline:none; transition:.2s;
  }
  .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus{
    border-color:var(--green); box-shadow:0 0 0 3px rgba(16,185,129,.15);
  }
  .form-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
  .form-actions .btn{min-width:120px;}
  #waText{
    width:100%; padding:12px; border-radius:10px; background:#0e1524;
    color:var(--txt); border:1px solid var(--line); font-family:inherit;
    font-size:13px; resize:vertical; outline:none;
  }
  #waText:focus{border-color:var(--green);}
  #toast{
    position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translate(-50%,120%);
    background:linear-gradient(135deg,var(--green),#059669); color:#fff;
    padding:12px 22px; border-radius:12px; font-weight:700; font-size:13.5px;
    transition:transform .35s cubic-bezier(.2,1.2,.4,1); z-index:200;
    box-shadow:0 10px 30px rgba(16,185,129,.35);
    max-width:90vw;
  }
  #toast.show{transform:translate(-50%,0);}
  /* ===== Install hint banner ===== */
  #installHint{
    display:none;
    padding:10px 22px; font-size:12.5px;
    background:rgba(37,244,238,.08); border-bottom:1px solid rgba(37,244,238,.2);
    color:var(--cyan);
  }
  #installHint button{
    background:transparent; border:1px solid rgba(37,244,238,.4);
    color:var(--cyan); padding:4px 10px; border-radius:8px; cursor:pointer;
    font-family:inherit; font-size:11.5px; margin-inline-start:8px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">📒</div>
  <div class="brand">
    <h1>دفتر الطلبات</h1>
    <p>إدارة طلبات تيك توك وواتساب للبائع العراقي</p>
  </div>
  <div class="actions">
    <button class="btn ghost" id="installBtn" style="display:none">📲 تثبيت</button>
    <button class="btn ghost" id="pasteWA">📱 لصق رسالة واتساب</button>
    <button class="btn primary" id="addOrder">＋ طلب جديد</button>
  </div>
</header>

<div id="installHint">
  💡 يمكنك تثبيت التطبيق على شاشة هاتفك للوصول السريع.
  <button onclick="document.getElementById('installBtn').click(); this.parentElement.style.display='none'">تثبيت الآن</button>
  <button onclick="this.parentElement.style.display='none'">لاحقًا</button>
</div>

<main>
  <section class="kpis" id="kpis"></section>

  <div class="layout">
    <section class="main-col">
      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <input class="search" id="search" placeholder="🔍 ابحث بالاسم أو المنتج أو الهاتف">
      </div>
      <div class="orders" id="orders"></div>
    </section>

    <aside class="side-col">
      <div class="panel">
        <h3>🏙️ أفضل المدن</h3>
        <div id="cities"></div>
      </div>
      <div class="panel">
        <h3>💡 معلومات</h3>
        <p class="hint">كل البيانات تُحفظ محليًا في متصفحك (localStorage). لا تُرسل لأي خادم خارجي.</p>
        <button class="btn tiny ghost" id="exportCSV">⬇ تصدير CSV</button>
        <button class="btn tiny danger" id="resetData">🧹 مسح وإعادة تهيئة</button>
      </div>
    </aside>
  </div>
</main>

<!-- Modals -->
<div class="modal" id="detailModal"><div class="modal-box" id="detailBox"></div></div>
<div class="modal" id="addModal"><div class="modal-box" id="addBox"></div></div>
<div class="modal" id="waModal"><div class="modal-box" id="waBox"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   دفتر الطلبات — نسخة PWA (بيانات محلية)
   ============================================================ */
const STORE_KEY = 'iraq_order_book_v1';

const STATUS = {
  new:       { label:'جديد',        color:'#3b82f6' },
  confirmed: { label:'مؤكد',        color:'#06b6d4' },
  shipped:   { label:'قيد التوصيل', color:'#f59e0b' },
  delivered: { label:'تم التسليم',  color:'#10b981' },
  cancelled: { label:'ملغي',        color:'#ef4444' },
  returned:  { label:'مرتجع',       color:'#94a3b8' }
};

const CITIES = ['بغداد','البصرة','الموصل','أربيل','النجف','كربلاء','السليمانية','الناصرية','الحلة','كركوك','الديوانية','السماوة','العمارة','دهوك','زاخو'];

const SOURCE_LABEL = { tiktok:'تيك توك', whatsapp:'واتساب', manual:'يدوي' };

/* ===== أدوات ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtIQD = n => (Number(n)||0).toLocaleString('en-US') + ' د.ع';
const total = o => (o.qty||0) * (o.price||0) + (o.delivery||0);
const nowMs = () => Date.now();

function relTime(ts){
  const diff = nowMs() - ts;
  const m = Math.floor(diff / 60000);
  if(m < 1) return 'الآن';
  if(m < 60) return `منذ ${m} د`;
  const h = Math.floor(m/60);
  if(h < 24) return `منذ ${h} س`;
  const d = Math.floor(h/24);
  if(d < 7) return `منذ ${d} يوم`;
  return new Date(ts).toLocaleDateString('ar-IQ');
}

/* ===== بيانات تجريبية ===== */
function seedOrders(){
  const n = nowMs(); const m = 60000;
  return [
    {id:'ORD-1058', name:'مصطفى كريم',  phone:'07701234567', city:'بغداد',     address:'الكرادة، شارع 62',  product:'سيروم فيتامين C',       qty:2, price:25000, delivery:5000, status:'new',       source:'tiktok',   notes:'اتصل بعد الساعة 5 مساءً', createdAt:n-4*m},
    {id:'ORD-1057', name:'زينب حسن',     phone:'07812345678', city:'البصرة',    address:'العشار، شارع الجزائر', product:'مكواة شعر سيراميك',     qty:1, price:39000, delivery:6000, status:'new',       source:'whatsapp', notes:'', createdAt:n-18*m},
    {id:'ORD-1056', name:'علي عبد الله', phone:'07509876543', city:'أربيل',     address:'عنكاوا، شارع 40',     product:'حزام مقاومة (5 قطع)',   qty:3, price:19000, delivery:5000, status:'confirmed', source:'tiktok',   notes:'', createdAt:n-55*m},
    {id:'ORD-1055', name:'سارة أحمد',    phone:'07701122334', city:'النجف',     address:'حي الأمير، زقاق 12',  product:'منظّم أدراج المطبخ',   qty:2, price:18900, delivery:4000, status:'confirmed', source:'whatsapp', notes:'تأكيد عبر واتساب', createdAt:n-2*60*m},
    {id:'ORD-1054', name:'محمد جاسم',    phone:'07803344556', city:'بغداد',     address:'المنصور، شارع 14 رمضان', product:'سماعات بلوتوث',     qty:1, price:34900, delivery:5000, status:'shipped',   source:'tiktok',   notes:'', createdAt:n-5*60*m},
    {id:'ORD-1053', name:'رقية صالح',    phone:'07705566778', city:'كربلاء',    address:'حي الحسين',           product:'لعبة تعليمية خشبية',   qty:1, price:21000, delivery:4000, status:'shipped',   source:'tiktok',   notes:'', createdAt:n-8*60*m},
    {id:'ORD-1052', name:'حسين مهدي',    phone:'07507788990', city:'السليمانية', address:'سالم، شارع 20',      product:'محضّرة قهوة محمولة',   qty:1, price:45000, delivery:6000, status:'delivered', source:'whatsapp', notes:'', createdAt:n-22*60*m},
    {id:'ORD-1051', name:'نور الهدى',    phone:'07709900112', city:'الموصل',    address:'الجامعة، حي الزهراء', product:'حقيبة ظهر USB',         qty:1, price:36000, delivery:6000, status:'delivered', source:'tiktok',   notes:'', createdAt:n-30*60*m},
    {id:'ORD-1050', name:'كرار عبد',     phone:'07712345566', city:'بغداد',     address:'زيونة، شارع الربيعي',  product:'حامل هاتف مغناطيسي',   qty:2, price:14500, delivery:5000, status:'delivered', source:'tiktok',   notes:'', createdAt:n-26*60*m},
    {id:'ORD-1049', name:'فاطمة عباس',   phone:'07801122334', city:'الحلة',     address:'الجامعة، حي الأكرمين', product:'فرشاة تنظيف حيوانات', qty:1, price:16500, delivery:4000, status:'cancelled', source:'whatsapp', notes:'رفضت عند الاتصال', createdAt:n-2*24*60*m},
    {id:'ORD-1048', name:'أمير سعد',     phone:'07503344556', city:'الناصرية',  address:'حي سومر',             product:'زجاجة ماء ذكية',        qty:1, price:22000, delivery:5000, status:'returned',  source:'tiktok',   notes:'المنتج تالف', createdAt:n-3*24*60*m},
    {id:'ORD-1047', name:'ليلى محمود',   phone:'07705566778', city:'بغداد',     address:'الجادرية',            product:'بساط يوغا',             qty:1, price:26500, delivery:5000, status:'delivered', source:'tiktok',   notes:'', createdAt:n-4*24*60*m},
    {id:'ORD-1046', name:'عباس فاضل',    phone:'07809900112', city:'البصرة',    address:'الجبيلة',             product:'سيروم فيتامين C',       qty:3, price:25000, delivery:6000, status:'delivered', source:'whatsapp', notes:'', createdAt:n-5*24*60*m},
    {id:'ORD-1045', name:'تبارك علي',    phone:'07711122334', city:'كركوك',     address:'حي واسطي',            product:'نافورة مياه قطط',       qty:1, price:31000, delivery:6000, status:'delivered', source:'tiktok',   notes:'', createdAt:n-6*24*60*m},
    {id:'ORD-1044', name:'مريم كاظم',    phone:'07813344556', city:'الديوانية', address:'حي العسكري',          product:'حزام مقاومة (5 قطع)',   qty:2, price:19000, delivery:5000, status:'new',       source:'tiktok',   notes:'', createdAt:n-30*m}
  ];
}

/* ===== حالة ===== */
let orders = [];
const state = { status:'all', query:'' };

function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  } catch(e){}
  return seedOrders();
}
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(orders)); } catch(e){}
}

function nextId(){
  const nums = orders.map(o => parseInt(o.id.replace(/\D/g,'')) || 0);
  const mx = nums.length ? Math.max(...nums) : 1000;
  return 'ORD-' + (mx + 1);
}

/* ===== عرض الإحصاءات ===== */
function renderKPIs(){
  const today = new Date().toDateString();
  const todayCount = orders.filter(o => new Date(o.createdAt).toDateString() === today).length;
  const newCount = orders.filter(o => o.status === 'new').length;
  const shippedCount = orders.filter(o => o.status === 'shipped').length;
  const expected = orders
    .filter(o => ['confirmed','shipped','delivered'].includes(o.status))
    .reduce((s,o) => s + total(o), 0);

  const cards = [
    {icon:'📦', label:'طلبات اليوم',       value: todayCount,       cls:'cyan'},
    {icon:'⏳', label:'بانتظار التأكيد',   value: newCount,         cls:'blue'},
    {icon:'🚚', label:'قيد التوصيل',       value: shippedCount,     cls:'amber'},
    {icon:'💰', label:'التحصيل المتوقع',   value: fmtIQD(expected), cls:'green sm'}
  ];
  $('#kpis').innerHTML = cards.map(c => `
    <div class="kpi">
      <div class="icon">${c.icon}</div>
      <div>
        <div class="klabel">${c.label}</div>
        <div class="kval ${c.cls}">${c.value}</div>
      </div>
    </div>`).join('');
}

/* ===== تبويبات الفلترة ===== */
function renderTabs(){
  const counts = { all: orders.length };
  Object.keys(STATUS).forEach(k => counts[k] = orders.filter(o => o.status === k).length);
  const tabs = [['all','الكل']].concat(Object.entries(STATUS).map(([k,v]) => [k,v.label]));
  $('#tabs').innerHTML = tabs.map(([k,l]) =>
    `<button class="tab ${state.status===k?'active':''}" data-tab="${k}">${l} <span class="cnt">${counts[k]||0}</span></button>`
  ).join('');
}

/* ===== قائمة الطلبات ===== */
function filtered(){
  let list = orders.slice();
  if(state.status !== 'all') list = list.filter(o => o.status === state.status);
  if(state.query.trim()){
    const q = state.query.trim().toLowerCase();
    list = list.filter(o =>
      o.name.toLowerCase().includes(q) ||
      o.product.toLowerCase().includes(q) ||
      o.phone.includes(q) ||
      o.id.toLowerCase().includes(q)
    );
  }
  return list.sort((a,b) => b.createdAt - a.createdAt);
}

function renderOrders(){
  const list = filtered();
  if(!list.length){
    $('#orders').innerHTML = `<div class="empty">لا توجد طلبات مطابقة<br><small>جرّب تغيير الفلتر أو البحث</small></div>`;
    return;
  }
  $('#orders').innerHTML = list.map(o => {
    const st = STATUS[o.status];
    return `
    <div class="order" data-open="${o.id}">
      <span class="badge ${o.status}">${st.label}</span>
      <div class="cust">
        <div class="name">${esc(o.name)}</div>
        <div class="meta">${esc(o.city)} · ${esc(o.phone)} · ${SOURCE_LABEL[o.source]||''}</div>
      </div>
      <div class="prod">
        <div>${esc(o.product)}</div>
        <div class="meta">× ${o.qty} · توصيل ${fmtIQD(o.delivery)}</div>
      </div>
      <div class="total">${fmtIQD(total(o))}</div>
      <div class="time">${relTime(o.createdAt)}</div>
    </div>`;
  }).join('');
}

/* ===== أفضل المدن ===== */
function renderCities(){
  const map = {};
  orders.forEach(o => map[o.city] = (map[o.city]||0) + 1);
  const top = Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0,6);
  $('#cities').innerHTML = top.length
    ? top.map(([c,n]) => `<div class="city-row"><span>${esc(c)}</span><span class="city-count">${n} طلب</span></div>`).join('')
    : '<div class="hint">لا توجد بيانات بعد.</div>';
}

/* ===== عرض شامل ===== */
function render(){
  renderKPIs();
  renderTabs();
  renderOrders();
  renderCities();
}

/* ===== نافذة تفاصيل الطلب ===== */
function openOrder(id){
  const o = orders.find(x => x.id === id);
  if(!o) return;

  const transitions = {
    new:       [['confirmed','✅ تأكيد الطلب','primary'], ['cancelled','❌ إلغاء','danger']],
    confirmed: [['shipped','🚚 شحن','primary'],           ['cancelled','❌ إلغاء','danger']],
    shipped:   [['delivered','📦 تم التسليم','primary'], ['returned','↩ مرتجع','danger']],
    delivered: [],
    cancelled: [['new','🔄 إعادة فتح','ghost']],
    returned:  [['new','🔄 إعادة فتح','ghost']]
  };
  const st = STATUS[o.status];
  const btns = (transitions[o.status] || []).map(([s,l,c]) => 
    `<button class="btn ${c}" data-trans="${s}">${l}</button>`
  ).join('');
  const waLink = `https://wa.me/964${o.phone.replace(/^0/,'')}`;

  $('#detailBox').innerHTML = `
    <div class="detail-head">
      <div>
        <h2>${o.id}</h2>
        <div class="meta">${relTime(o.createdAt)} · المصدر: ${SOURCE_LABEL[o.source]}</div>
      </div>
      <span class="badge ${o.status}">${st.label}</span>
    </div>

    <div class="detail-grid">
      <div class="detail-item"><div class="k">👤 الاسم</div><div class="v">${esc(o.name)}</div></div>
      <div class="detail-item"><div class="k">📞 الهاتف</div><div class="v"><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div></div>
      <div class="detail-item"><div class="k">🏙️ المدينة</div><div class="v">${esc(o.city)}</div></div>
      <div class="detail-item"><div class="k">📍 العنوان</div><div class="v">${esc(o.address||'—')}</div></div>
      <div class="detail-item wide"><div class="k">📦 المنتج</div><div class="v">${esc(o.product)}</div></div>
      <div class="detail-item"><div class="k">الكمية</div><div class="v">× ${o.qty}</div></div>
      <div class="detail-item"><div class="k">سعر الوحدة</div><div class="v">${fmtIQD(o.price)}</div></div>
      <div class="detail-item"><div class="k">التوصيل</div><div class="v">${fmtIQD(o.delivery)}</div></div>
      <div class="detail-item"><div class="k">الإجمالي</div><div class="v total">${fmtIQD(total(o))}</div></div>
    </div>

    ${o.notes ? `<div class="notes">📝 ${esc(o.notes)}</div>` : ''}

    <div class="detail-actions">
      <a class="btn ghost" href="${waLink}" target="_blank" rel="noopener">💬 واتساب</a>
      ${btns}
    </div>
    <button class="btn close" onclick="document.getElementById('detailModal').classList.remove('open')">إغلاق</button>
  `;

  $('#detailBox').querySelectorAll('[data-trans]').forEach(b => {
    b.onclick = () => {
      o.status = b.dataset.trans;
      save(); render(); openOrder(id);
      showToast(`تم التحديث إلى: ${STATUS[o.status].label}`);
    };
  });

  $('#detailModal').classList.add('open');
}

/* ===== نافذة إضافة طلب ===== */

  $('#addBox').innerHTML = `
    <h2>➕ طلب جديد</h2>

          </select>
        </label>

      phone: String(fd.get('phone')).trim(),
      city: String(fd.get('city')),
      address: String(fd.get('address')).trim(),

    orders.unshift(order);

    showToast('✅ تم حفظ الطلب');
  };

  $('#addModal').classList.add('open');
}

/* ===== استيراد من واتساب ===== */
function parseWA(text){
  const res = { name:'', phone:'', city:'', address:'', product:'', qty:1, price:0, delivery:5000, source:'whatsapp', notes:'' };

  const phoneM = text.match(/07\d{2}[\s-]?\d{3}[\s-]?\d{4}/);
  if(phoneM) res.phone = phoneM[0].replace(/[\s-]/g,'');

  const nameM = text.match(/(?:الاسم|اسمي|الاسم الكامل)\s*[:：]?\s*(.+)/i);
  if(nameM) res.name = nameM[1].trim().split('\n')[0];

  const addrM = text.match(/(?:العنوان|السكن|المنطقة|أقطن)\s*[:：]?\s*(.+)/i);
  if(addrM) res.address = addrM[1].trim().split('\n')[0];

  for(const c of CITIES){
    if(text.includes(c)){ res.city = c; break; }
  }

  const qtyM = text.match(/(?:الكمية|العدد|كمية)\s*[:：]?\s*(\d+)/i);
  if(qtyM) res.qty = parseInt(qtyM[1]) || 1;

  const prodM = text.match(/(?:أطلب|اطلب|أريد|اريد|منتج)\s*[:：]?\s*(.+)/i);
  if(prodM) res.product = prodM[1].trim().split('\n')[0];

  if(!res.name && !res.phone && !res.product){
    res.notes = text.slice(0, 200);
  }
  return res;
}

function openWA(){
  $('#waBox').innerHTML = `
    <h2>📱 استيراد طلب من واتساب</h2>
    <div class="sub">الصق رسالة العميل وسنستخرج البيانات تلقائيًا. يمكنك تعديلها قبل الحفظ.</div>
    <textarea id="waText" rows="7" placeholder="الصق رسالة واتساب هنا…"></textarea>
    <button class="btn tiny ghost" id="waSample" style="margin-top:8px">📋 تجربة رسالة نموذجية</button>
    <div class="form-actions" style="margin-top:16px">
      <button class="btn ghost" onclick="document.getElementById('waModal').classList.remove('open')">إلغاء</button>
      <button class="btn primary" id="waParse">🔍 تحليل الرسالة</button>
    </div>
  `;
  $('#waSample').onclick = () => {
    $('#waText').value = `السلام عليكم\nأريد أطلب سيروم فيتامين C\nالاسم: أحمد علي حسن\nرقم: 07701234567\nالعنوان: بغداد، الكرادة، شارع 62\nالكمية: 2`;
  };
  $('#waParse').onclick = () => {
    const text = $('#waText').value.trim();
    if(!text) return showToast('الصق النص أولًا');
    const parsed = parseWA(text);
    $('#waModal').classList.remove('open');
    openAddOrder(parsed);
    showToast('تم تحليل الرسالة — راجع البيانات');
  };
  $('#waModal').classList.add('open');
}

/* ===== تصدير CSV ===== */
function exportCSV(){
  const headers = ['رقم الطلب','الاسم','الهاتف','المدينة','العنوان','المنتج','الكمية','سعر الوحدة','التوصيل','الإجمالي','الحالة','المصدر','التاريخ'];
  const rows = orders.map(o => [
    o.id, o.name, o.phone, o.city, o.address, o.product,
    o.qty, o.price, o.delivery, total(o),
    STATUS[o.status].label, SOURCE_LABEL[o.source],
    new Date(o.createdAt).toLocaleString('ar-IQ')
  ]);
  const csv = '\uFEFF' + [headers, ...rows]
    .map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))
    .join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `orders-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📥 تم تصدير CSV');
}

/* ===== إشعار ===== */
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ===== الأحداث ===== */
$('#addOrder').onclick = () => openAddOrder();
$('#pasteWA').onclick = () => openWA();
$('#exportCSV').onclick = () => exportCSV();
$('#resetData').onclick = () => {
  if(!confirm('سيتم مسح جميع الطلبات وإعادة البيانات التجريبية. متابعة؟')) return;
  orders = seedOrders(); save(); render();
  showToast('🧹 تم إعادة التهيئة');
};

$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if(!t) return;
  state.status = t.dataset.tab;
  renderTabs(); renderOrders();
});

$('#search').addEventListener('input', e => {
  state.query = e.target.value;
  renderOrders();
});

$('#orders').addEventListener('click', e => {
  const row = e.target.closest('[data-open]');
  if(row) openOrder(row.dataset.open);
});

document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => {
    if(e.target === m) m.classList.remove('open');
  });
});

/* ===== التشغيل ===== */
orders = load();
render();
</script>

<!-- ===== PWA: تسجيل Service Worker + زر التثبيت ===== -->
<script>
(function(){
  // تسجيل Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // زر التثبيت
  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');
  const installHint = document.getElementById('installHint');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.style.display = 'inline-flex';
    // إظهار شريط التثبيت مرة واحدة لكل جلسة
    try {
      if (!sessionStorage.getItem('hintShown') && installHint) {
        installHint.style.display = 'block';
        sessionStorage.setItem('hintShown', '1');
      }
    } catch(err){}
  });

  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) {
        alert('لتثبيت التطبيق:\n\n📱 في Chrome (أندرويد):\nالقائمة (⋮) ← "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية"\n\n📱 في Safari (آيفون):\nزر المشاركة ⎋ ← "إضافة إلى الشاشة الرئيسية"');
        return;
      }
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
      if (installHint) installHint.style.display = 'none';
    });
  }

  window.addEventListener('appinstalled', () => {
    if (installBtn) installBtn.style.display = 'none';
    if (installHint) installHint.style.display = 'none';
  });
})();
</script>
